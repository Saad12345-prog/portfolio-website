name: CI Develop Lint

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Run HTMLHint
        run: htmlhint "**/*.html" --config .htmlhintrc.json

      - name: Run Stylelint
        run: stylelint "**/*.css" --config .stylelintrc.json --allow-empty-input
